name: CI
# README.md is the only Markdown here and nothing reads it: a README-only
# change skips the macOS style/audit leg. No check is required on main.
on:
  pull_request:
    paths-ignore: ['*.md']
  push:
    branches: [main]
    paths-ignore: ['*.md']
  workflow_dispatch:
permissions:
  contents: read
# This repository is public: GitHub-hosted runners are free here, and the org's
# self-hosted (k3s) runner group must never serve a public repository, so
# neither job follows vars.CI_RUNNER.
jobs:
  deterministic:
    # Offline regeneration from upstream-lock.json must reproduce the committed tap exactly.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -I scripts/generate-tap.py .
      - run: git diff --exit-code
  style-audit:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # The runner image may predate DSL used by the upstream casks.
      - name: Update Homebrew
        run: brew update
      - name: Tap this checkout
        id: tap
        run: |
          brew tap hotchi-dev/tap "$GITHUB_WORKSPACE"
          brew trust hotchi-dev/tap
      - name: brew style (per package)
        run: bash scripts/check-tap.sh style
      - name: brew audit (per package)
        if: ${{ !cancelled() && steps.tap.outcome == 'success' }}
        run: bash scripts/check-tap.sh audit
