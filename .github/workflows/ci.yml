name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    # Offline regeneration from upstream-lock.json must reproduce the committed tap exactly.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -I scripts/generate-tap.py .
      - run: git diff --exit-code
  style-audit:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # The Blacksmith image may predate DSL used by the upstream casks.
      - name: Update Homebrew
        run: brew update
      - name: Tap this checkout
        run: |
          brew tap hotchi-dev/tap "$GITHUB_WORKSPACE"
          brew trust hotchi-dev/tap
      # netbird-ui is copied verbatim from netbirdio/homebrew-tap and does not meet
      # homebrew-core cask style; it is excluded rather than rewritten.
      - name: brew style
        run: |
          tap="$(brew --repository hotchi-dev/tap)"
          brew style "$tap"/Formula/*.rb "$tap"/Casks/claude-code.rb "$tap"/Casks/codex.rb
      # Excluded checks, each inherent to copying Homebrew's own metadata:
      #   urls: "HTTP mirror" for curl deps; the formulae API publishes no mirrors and
      #         the mirror only matters for building curl from source, which this tap never does.
      #   installed: inspects the runner's preinstalled homebrew-core kegs, not this tap.
      #   sha256_no_check_if_unversioned: netbird-ui is netbirdio's cask copied verbatim
      #         (same URL and sha256) by decision.
      - name: brew audit
        run: brew audit --tap hotchi-dev/tap --except=urls,installed,sha256_no_check_if_unversioned
